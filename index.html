<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Program Latihan 11 Minggu</title>
<style>
  :root{
    --navy:#0d1b2e;
    --blue:#1d6fb8;
    --green:#1f7a4d;
    --purple:#5b2a91;
    --magenta:#8e2f7a;
    --black:#15181f;
    --gray:#5c5c5c;
    --paper:#f4f1ea;
    --line:#d8d2c4;
    --ink:#1a1a1a;
    --gold:#f0b429;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:#e9e4d8;
    color:var(--ink);
    padding:20px;
  }
  .page-title{
    text-align:center;
    color:var(--navy);
    margin:0 0 4px 0;
    font-size:28px;
    letter-spacing:0.5px;
  }
  .page-sub{
    text-align:center;
    color:#555;
    margin:0 0 20px 0;
    font-size:14px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    max-width:1900px;
    margin:0 auto;
  }
  @media (max-width:1500px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:800px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--paper);
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
    border:1px solid #c9c2ae;
  }
  .card-head{
    background:var(--navy);
    color:#fff;
    padding:10px 12px 8px;
    text-align:center;
  }
  .card-head .num{
    font-size:20px;
    font-weight:800;
    letter-spacing:0.5px;
  }
  .card-head .phase{
    color:var(--gold);
    font-size:12px;
    font-weight:700;
    letter-spacing:0.5px;
    margin-left:6px;
  }
  .card-head .fokus{
    font-size:10.5px;
    color:#e8e8e8;
    margin-top:3px;
    font-weight:400;
  }
  .days{
    display:grid;
    grid-template-columns:1fr 1fr 0.6fr 1fr 1fr 0.85fr 0.6fr;
    min-height:0;
  }
  .day-head{
    color:#fff;
    text-align:center;
    padding:6px 2px;
    font-size:10px;
    font-weight:700;
    line-height:1.3;
  }
  .day-head .d1{font-size:10.5px;}
  .day-head .d2{font-size:8.5px; font-weight:600; opacity:.95;}
  .day-col{
    background:#fbfaf6;
    border-right:1px solid var(--line);
    padding:6px 4px;
  }
  .day-col:last-child{border-right:none;}
  .ex{
    font-size:8.6px;
    line-height:1.25;
    padding:3px 1px;
    border-bottom:1px dotted #e0dccf;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .ex:last-child{border-bottom:none;}
  .ex .txt{flex:1; min-width:0;}
  .ex .nm{font-weight:700; color:#1a1a1a; display:block;}
  .ex .set{color:#444; font-weight:600;}
  .ex-icon{
    flex:0 0 auto;
    width:20px;
    height:20px;
    background:#eef1e9;
    border-radius:4px;
    padding:1.5px;
  }
  .ex-icon svg{width:100%; height:100%; display:block;}
  .cardio-col{
    background:#f1efe9;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6px 2px;
    font-size:8.6px;
    font-weight:700;
    line-height:1.4;
  }
  .cardio-col .run{font-size:20px; margin-bottom:4px;}
  .rest-col{
    background:#e9e7e1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:6px 2px;
    font-size:8.6px;
    font-weight:700;
    line-height:1.4;
    color:#666;
    border-right:1px solid var(--line);
  }
  .rest-col .zzz{font-size:18px; margin-bottom:4px;}
  .footer-table{
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr 1fr;
    border-top:1px solid var(--line);
    font-size:9px;
  }
  .footer-table .blank{grid-column:1;}
  .footer-hdr{
    background:var(--purple);
    color:#fff;
    text-align:center;
    font-weight:700;
    padding:3px 2px;
    font-size:8.5px;
  }
  .footer-val{
    text-align:center;
    padding:5px 3px;
    font-weight:700;
    background:#fbfaf6;
    border-right:1px solid var(--line);
  }
  .target{
    text-align:center;
    font-size:9px;
    padding:6px 8px 8px;
    background:#efe9dc;
    font-weight:600;
  }
  .target b{color:var(--navy);}

  .legend{
    max-width:1900px;
    margin:16px auto 0;
    background:var(--navy);
    color:#fff;
    border-radius:8px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:0;
  }
  .legend .col{padding:14px 18px; border-right:1px solid rgba(255,255,255,0.15);}
  .legend .col:last-child{border-right:none;}
  .legend h4{color:var(--gold); margin:0 0 8px 0; font-size:13px;}
  .legend ul{margin:0; padding-left:16px; font-size:11.5px; line-height:1.6;}
  .legend p{margin:2px 0 6px; font-size:11.5px;}
  @media (max-width:900px){ .legend{grid-template-columns:1fr 1fr;} }
</style>
</head>

<h1 class="page-title">PROGRAM LATIHAN 11 MINGGU</h1>
<p class="page-sub">Upper / Lower / Push / Pull Split &middot; 4 Hari Latihan Beban + 1 Hari Jogging + 2 Hari Rest</p>

<div class="grid" id="grid"></div>
<div class="legend" id="legend"></div>

<script>
const COLORS = { blue:"#1d6fb8", green:"#1f7a4d", black:"#15181f", purple:"#5b2a91", magenta:"#8e2f7a", gray:"#5c5c5c" };

// Reusable exercise lists per day-type (names identical across all weeks; only sets/reps change)
const UPPER_A_NAMES = ["Incline Smith Machine","Lat Pulldown","Incline DB Press","Chest Supported Row","Lateral Raise","Triceps Pushdown","DB Curl"];
const LOWER_A_NAMES = ["Smith Squat","Leg Press","Romanian Deadlift","Leg Curl","Leg Extension","Calf Raise","Cable Crunch"];
const PUSH_NAMES = ["Incline Smith Machine","Incline DB Press","DB Shoulder Press","Cable Fly","Lateral Raise","Triceps Pushdown","Overhead Triceps Ext."];
const PULL_NAMES = ["Lat Pulldown","Lat Pulldown (wide)","Seated Cable Row","Chest Supported Row","Face Pull","DB Curl","Hammer Curl"];

const ICON_MAP = {
  "Incline Smith Machine":"press", "Incline DB Press":"press",
  "Lat Pulldown":"pulldown", "Lat Pulldown (wide)":"pulldown",
  "Chest Supported Row":"row", "Seated Cable Row":"row",
  "Lateral Raise":"lateral",
  "Triceps Pushdown":"pushdown",
  "DB Curl":"curl", "Hammer Curl":"curl",
  "Smith Squat":"squat",
  "Leg Press":"legpress",
  "Romanian Deadlift":"deadlift", "RDL":"deadlift",
  "Leg Curl":"legcurl",
  "Leg Extension":"legext",
  "Calf Raise":"calf",
  "Cable Crunch":"crunch",
  "DB Shoulder Press":"ohp",
  "Cable Fly":"fly",
  "Face Pull":"facepull",
  "Overhead Triceps Ext.":"ohtriceps",
  "Bulgarian Split Squat":"splitsquat",
  "Hip Thrust (Smith)":"hipthrust",
  "Leg Raise":"legraise"
};

function z(names, sets){ return names.map((n,i)=>[n, sets[i], ICON_MAP[n] || "press"]); }

const weeks = [
{num:1, phase:"ADAPTASI & FONDASI", fokus:"Konsistensi, tingkatkan kontrol & volume ringan",
 a:z(UPPER_A_NAMES,["3x8-12","3x8-12","3x8-12","3x10-12","3x12-15","2x12-15","2x12-15"]),
 b:z(LOWER_A_NAMES,["3x8-12","3x8-12","3x8-12","2x12-15","3x12-15","3x12-15","2x12-15"]),

function exHTML(list){
  return list.map((e,i)=>`<div class="ex"><span class="ex-icon"><svg><use href="#ico-${e[2]}"/></svg></span><span class="txt"><span class="nm">${i+1}. ${e[0]}</span><span class="set">${e[1]}</span></span></div>`).join("");
}

function cardHTML(w){
  return `
  <div class="card">
    <div class="card-head">
      <span class="num">MINGGU ${w.num}</span><span class="phase">${w.phase}</span>
      <div class="fokus">Fokus: ${w.fokus}</div>
    </div>
    <div class="days">
      <div class="day-head" style="background:${COLORS.blue}"><div class="d1">SENIN</div><div class="d2">UPPER</div></div>
      <div class="day-head" style="background:${COLORS.green}"><div class="d1">SELASA</div><div class="d2">LOWER</div></div>
      <div class="day-head" style="background:${COLORS.gray}"><div class="d1">RABU</div><div class="d2">REST</div></div>
      <div class="day-head" style="background:${COLORS.purple}"><div class="d1">KAMIS</div><div class="d2">PUSH DAY</div></div>
      <div class="day-head" style="background:${COLORS.magenta}"><div class="d1">JUMAT</div><div class="d2">PULL DAY</div></div>
      <div class="day-head" style="background:${COLORS.black}"><div class="d1">SABTU</div><div class="d2">JOGGING</div></div>
      <div class="day-head" style="background:${COLORS.gray}"><div class="d1">MINGGU</div><div class="d2">REST</div></div>
    </div>
    <div class="days">
      <div class="day-col">${exHTML(w.a)}</div>
      <div class="day-col">${exHTML(w.b)}</div>
      <div class="rest-col"><div class="zzz">&#128564;</div>ISTIRAHAT<br>PENUH</div>
      <div class="day-col">${exHTML(w.c)}</div>
      <div class="day-col">${exHTML(w.d)}</div>
      <div class="cardio-col"><div class="run">&#127939;</div>JOGGING<br>30 MENIT<br><br>PACE<br>7:00-7:30<br>/KM</div>
      <div class="rest-col" style="border-right:none;"><div class="zzz">&#128564;</div>ISTIRAHAT<br>PENUH</div>
    </div>
    <div class="footer-table">
      <div class="blank"></div>
      <div class="footer-hdr">SET x REPS</div>
      <div class="footer-hdr">RIR</div>
      <div class="footer-hdr" style="grid-column: span 2;">REST</div>
    </div>
    <div class="footer-table">

    </div>
    <div class="target"><b>TARGET:</b> ${w.target}</div>
  </div>`;
}
